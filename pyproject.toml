[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "mewcat"
version = "0.1.0"
description = "A fast exact solver for the Maximum Edge-Weighted Clique Problem (MEWCat, AAAI-24) with pybind11 bindings"
readme = "README.md"
requires-python = ">=3.9"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.expand-macos-universal-tags = true
